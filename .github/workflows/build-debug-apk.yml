name: Build Debug APK (Sanatorio 3D)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Compilar APK Debug (C++, Rust, Lua)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android NDK y CMake
        run: |
          yes | sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Instalar dependencias de compilacion C++
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Instalar Rust y arquitecturas Android (Rustup)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Precompilar libreria estatica de Rust para todas las arquitecturas
        run: |
          source "$HOME/.cargo/env"
          cargo build --release --target aarch64-linux-android --manifest-path app/src/main/rust/Cargo.toml
          cargo build --release --target armv7-linux-androideabi --manifest-path app/src/main/rust/Cargo.toml
          cargo build --release --target x86_64-linux-android --manifest-path app/src/main/rust/Cargo.toml

      - name: Configurar Gradle (Sin Cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true

      - name: Generar firma de depuracion (Keystore obligatoria)
        run: |
          chmod +x ./ensure_keystore.sh
          ./ensure_keystore.sh

      - name: Compilar APK Debug
        run: |
          gradle assembleDebug --no-build-cache --no-daemon --stacktrace

      - name: Verificar existencia y firma del APK Debug
        run: |
          echo "=== Contenido del directorio de salida APK ==="
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk || (echo "❌ Error: app-debug.apk no encontrado" && exit 1)
          echo "✔ APK Debug generado y firmado exitosamente."

      - name: Subir APK Debug como artefacto de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Sanatorio3D-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
